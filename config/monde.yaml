# Monde Nissin Corporation (PSE: MONDE): company facts for the valuation.
#
# RULES:
# - Every number carries a `source` (and `as_of`). tests/test_valuation_config.py fails otherwise.
# - Financial statement figures are copied exactly as reported, in PHP thousands.
#   The loader converts them to PHP millions.
# - Public information only. Nothing here comes from inside the company.
# - A number that cannot be verified must be written as TODO_SOURCE, never guessed.

company:
  name: Monde Nissin Corporation
  ticker: MONDE
  exchange: Philippine Stock Exchange
  currency: PHP
  fiscal_year_end: "12-31"

sources:
  fy25_pr: &fy25_pr "Monde Nissin FY2025 press release with unaudited consolidated financial statements, 26 Mar 2026. https://mondenissin.com/wp-content/uploads/2026/03/MONDE-FY25-Press-Release.pdf"
  fy24_pr: &fy24_pr "Monde Nissin FY2024 press release with consolidated financial statements, 27 Mar 2025. https://mondenissin.com/wp-content/uploads/2025/03/MONDE-FY24-Press-Release.pdf"
  edge_9m26: &edge_9m26 "PSE EDGE, SEC Form 17-C C07825-2026 (9M 2026 results), 4 Nov 2026. https://edge.pse.com.ph/downloadHtml.do?file_id=1985845"
  bw_price: &bw_price "BusinessWorld, 'Monde Nissin shares climb on earnings, higher dividend', 8 Nov 2026. https://bworldonline.com/corporate/2026/11/08/792105/monde-nissin-shares-climb-on-earnings-higher-dividend/"
