  sa_monde: &sa_monde "stockanalysis.com, Monde Nissin (PSE:MONDE) overview, data from S&P Global Market Intelligence, as of 16 Oct 2026. https://stockanalysis.com/quote/pse/MONDE/"
  tribune_fy25: &tribune_fy25 "Daily Tribune, 'Monde Nissin soars to P8.6B net income in 2025', 26 Mar 2026. https://tribune.net.ph/2026/03/26/monde-nissin-soars-to-p86b-net-income-in-2025"
  adb_yield: &adb_yield "ADB AsianBondsOnline, Philippines market watch, close of 2 Nov 2026. https://asianbondsonline.adb.org/economy/?economy=PH&page=1"
  damodaran_ctry: &damodaran_ctry "Damodaran Online, Country Default Spreads and Risk Premiums, last updated 5 Jan 2026. https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/ctryprem.html"
